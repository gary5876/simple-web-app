# 이 저장소의 CI는 테스트와 이미지 빌드 확인만 한다(레지스트리 푸시·배포 없음, 시크릿 불필요).
# 배포는 인프라 프로젝트(one-click-deploy-k8s)의 파이프라인이 맡는다:
#   develop -> k8s/overlays/{aws,gcp}/dev,  main -> k8s/overlays/{aws,gcp}/prod
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # PR만 이전 실행을 취소한다. develop/main 푸시는 끝까지 실행한다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # testcontainers가 러너의 Docker로 Postgres/Redis 컨테이너를 띄운다.
      - run: make test-backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0
      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v
      - run: make k8s-validate

  images:
    if: github.event_name == 'push'
    needs: [backend, frontend, k8s]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 빌드만 확인한다(푸시 없음). 빌드 컨텍스트는 저장소 루트다.
      - run: docker build -t simple-web-app/auth:${{ github.sha }} -f services/auth/Dockerfile .
      - run: docker build -t simple-web-app/board:${{ github.sha }} -f services/board/Dockerfile .
      - run: docker build -t simple-web-app/frontend:${{ github.sha }} -f frontend/Dockerfile .
