apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: simple-web-app
labels:
  - pairs:
      app.kubernetes.io/part-of: simple-web-app
    includeSelectors: false
resources:
  - ../../base
  - ingress.yaml
  - backendconfig.yaml
  - frontendconfig.yaml
  - managedcertificate.yaml
patches:
  - path: nginx-service-patch.yaml
# KEDA가 설치된 클러스터라면 아래 주석을 풀고, docs/deploy.md대로 Redis 주소를 패치한다.
# KEDA가 Redis(Memorystore)에 접근할 수 있도록 방화벽/NetworkPolicy 허용도 필요하다.
# components:
#   - ../../components/keda-worker
configMapGenerator:
  - name: nginx-config
    behavior: merge
    literals:
      # 공백으로 구분한 CIDR 목록. nginx가 set_real_ip_from 여러 줄로 펼친다.
      # Google Front End 프록시 대역(130.211.0.0/22, 35.191.0.0/16)만 기본으로 넣었다.
      # GFE 프록시 대역(130.211.0.0/22, 35.191.0.0/16) + LB 전역 고정 IP.
      # 끝의 203.0.113.10/32는 자리표시자다. replace with simple-web-app-ip address
      # (gcloud compute addresses describe simple-web-app-ip --global --format='value(address)', docs/deploy.md).
      - REAL_IP_FROM=130.211.0.0/22 35.191.0.0/16 203.0.113.10/32
images:
  - name: simple-web-app/frontend
    newName: asia-northeast3-docker.pkg.dev/my-gcp-project/simple-web-app/frontend
    newTag: "0.1.0"
  - name: simple-web-app/auth
    newName: asia-northeast3-docker.pkg.dev/my-gcp-project/simple-web-app/auth
    newTag: "0.1.0"
  - name: simple-web-app/board
    newName: asia-northeast3-docker.pkg.dev/my-gcp-project/simple-web-app/board
    newTag: "0.1.0"
