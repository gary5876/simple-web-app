# GCP 개발(dev) 환경. develop 브랜치가 이 overlay로 배포된다.
# Secret app-db / app-redis는 prod와 이름이 같고, Terraform이 simple-web-app-dev 네임스페이스에 dev용 DB/Redis 주소로 만든다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: simple-web-app-dev
labels:
  - pairs:
      app.kubernetes.io/part-of: simple-web-app
    includeSelectors: false
resources:
  - ../base
  - managedcertificate.yaml
components:
  - ../../../components/dev-env
patches:
  - target:
      kind: Ingress
      name: web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.board.example.com
      - op: replace
        path: /metadata/annotations/kubernetes.io~1ingress.global-static-ip-name
        value: simple-web-app-dev-ip
      - op: replace
        path: /metadata/annotations/networking.gke.io~1managed-certificates
        value: web-cert-dev
configMapGenerator:
  - name: nginx-config
    behavior: merge
    literals:
      # 끝의 203.0.113.20/32는 자리표시자다. replace with simple-web-app-dev-ip address
      # (gcloud compute addresses describe simple-web-app-dev-ip --global --format='value(address)').
      - REAL_IP_FROM=130.211.0.0/22 35.191.0.0/16 203.0.113.20/32
# 태그 dev는 자리표시자다. 배포 파이프라인이 `kustomize edit set image`로 커밋 sha 태그를 넣는다.
images:
  - name: simple-web-app/frontend
    newName: asia-northeast3-docker.pkg.dev/my-gcp-project/simple-web-app/frontend
    newTag: dev
  - name: simple-web-app/auth
    newName: asia-northeast3-docker.pkg.dev/my-gcp-project/simple-web-app/auth
    newTag: dev
  - name: simple-web-app/board
    newName: asia-northeast3-docker.pkg.dev/my-gcp-project/simple-web-app/board
    newTag: dev
