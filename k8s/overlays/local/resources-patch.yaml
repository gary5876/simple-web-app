# 로컬(Docker Desktop ~4GiB)에 최소 replica가 들어가도록 requests만 절반으로 줄인다. limits는 그대로.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
spec:
  template:
    spec:
      containers:
        - name: nginx
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  template:
    spec:
      containers:
        - name: auth
          resources:
            requests:
              cpu: 125m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-api
spec:
  template:
    spec:
      containers:
        - name: board-api
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-worker
spec:
  template:
    spec:
      containers:
        - name: board-worker
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
