# AWS 개발(dev) 환경. develop 브랜치가 이 overlay로 배포된다.
# Secret app-db / app-redis는 prod와 이름이 같고, Terraform이 simple-web-app-dev 네임스페이스에 dev용 DB/Redis 주소로 만든다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: simple-web-app-dev
resources:
  - ../base
components:
  - ../../../components/dev-env
patches:
  - target:
      kind: Ingress
      name: web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: dev.board.example.com
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: arn:aws:acm:ap-northeast-2:123456789012:certificate/11111111-1111-1111-1111-111111111111
# 태그 dev는 자리표시자다. 배포 파이프라인이 `kustomize edit set image`로 커밋 sha 태그를 넣는다.
images:
  - name: simple-web-app/frontend
    newName: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/simple-web-app/frontend
    newTag: dev
  - name: simple-web-app/auth
    newName: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/simple-web-app/auth
    newTag: dev
  - name: simple-web-app/board
    newName: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/simple-web-app/board
    newTag: dev
