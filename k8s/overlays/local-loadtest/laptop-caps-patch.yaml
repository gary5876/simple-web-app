# 노트북(Docker Desktop 약 3.8GiB / 6 CPU)은 클라우드 최대치(auth 20, board-api 20 ...)를 감당하지 못한다.
# Pod가 너무 많이 뜨면 시작 비용과 CPU 경쟁으로 kube-apiserver와 probe까지 굶어 전체가 무너진다.
# 그래서 이 overlay에서만 HPA 최대치를 낮춘다. 클라우드 값은 base에 그대로 있다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth
spec:
  maxReplicas: 4
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-verify
spec:
  maxReplicas: 4
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: board-api
spec:
  maxReplicas: 6
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx
spec:
  maxReplicas: 4
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: board-worker
spec:
  maxReplicaCount: 4
---
# auth는 CPU 요청량만 base 값(250m)으로 되돌린다.
# argon2가 CPU를 많이 쓰므로 요청량이 작으면 HPA의 CPU %가 실제보다 크게 나와 과하게 늘어난다(폭주).
# 메모리 요청량은 local overlay의 절반 값(128Mi)을 유지한다. 3.8GiB VM에서 스케줄링 여유를 남기기 위해서다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  template:
    spec:
      containers:
        - name: auth
          resources:
            requests:
              cpu: 250m
