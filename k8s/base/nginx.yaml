apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx
    spec:
      terminationGracePeriodSeconds: 30
      # 존 하나가 죽어도 남도록 Pod를 존에 고르게 퍼뜨린다. 단일 존(kind)에서도 스케줄은 막지 않는다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: simple-web-app/frontend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: nginx-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # 부하로 CPU가 부족할 때 probe 한 번 늦었다고 Pod를 죽이면 재시작 폭주가 나므로 liveness는 넉넉히(5초 x 6회) 둔다.
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # LB(ALB 타깃 해제 / GCE NEG 제거)가 이 Pod로 새 요청을 보내지 않게 될 때까지 기다린 뒤 종료한다.
          # terminationGracePeriodSeconds(30) 안에 들어가야 한다.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "15"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    app.kubernetes.io/name: nginx
spec:
  selector:
    app.kubernetes.io/name: nginx
  ports:
    - name: http
      port: 80
      targetPort: http
