# 세션 검증(/internal/verify) 전용 auth 배포. 같은 이미지지만 로그인/가입 트래픽을 받지 않아
# argon2 부하와 격리된다. nginx가 VERIFY_UPSTREAM으로 여기에 연결한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-verify
  labels:
    app.kubernetes.io/name: auth-verify
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-verify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-verify
        simple-web-app/data-access: "true"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      # 존 하나가 죽어도 남도록 Pod를 존에 고르게 퍼뜨린다. 단일 존(kind)에서도 스케줄은 막지 않는다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-verify
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-verify
          image: simple-web-app/auth
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            # 세션 검증만 하므로 DB 장애/포화가 readiness를 깨지 않게 한다.
            - name: READY_REQUIRES_DB
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-db
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: app-redis
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # 부하로 CPU가 부족할 때 probe 한 번 늦었다고 Pod를 죽이면 재시작 폭주가 나므로 liveness는 넉넉히(5초 x 6회) 둔다.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-verify
  labels:
    app.kubernetes.io/name: auth-verify
spec:
  selector:
    app.kubernetes.io/name: auth-verify
  ports:
    - name: http
      port: 8000
      targetPort: http
